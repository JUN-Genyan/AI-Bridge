<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Bridge">
<meta name="color-scheme" content="light dark">
<meta name="rt-token" content="__RT_TOKEN__">
<title>会议室</title>
<style>
/* ===== 颜色 / 字体：浅色默认，深色跟系统 ===== */
:root{
  --bg:#ffffff;--side:#f7f7f8;--bar:#ffffff;--fg:#18181b;--mut:#71717a;--faint:#a1a1aa;--line:#e7e7ea;--soft:#f3f3f5;--hover:rgba(24,24,27,.05);
  --btn:#2563eb;--btn-fg:#fff;--me:#eef3ff;--me-line:#dbe5ff;--code:#f6f6f8;
  --claude:#d97757;--codex:#10a37f;--work:#d97706;--danger:#dc2626;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);--shadow-lg:0 12px 40px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;--mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#151517;--side:#1b1b1e;--bar:#1b1b1e;--fg:#ececf1;--mut:#a1a1aa;--faint:#6b6b74;--line:#2c2c31;--soft:#232328;--hover:rgba(255,255,255,.05);
  --btn:#3b82f6;--me:#1e2a44;--me-line:#2a3a5c;--code:#0f0f11;
  --claude:#e5896a;--codex:#2fbf94;--work:#f59e0b;--danger:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;background:var(--bg);color:var(--fg);font:15px/1.6 var(--font);display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s,color .15s,opacity .15s}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px}

/* ===== 顶栏 ===== */
header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bar) 85%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:10}
#title{font-weight:650;font-size:16px;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#title .wdn{font-weight:400;color:var(--mut);font-size:.85em}
#wd{display:none;font-size:12px;color:var(--mut);word-break:break-all;line-height:1.4;font-family:var(--mono)}
#bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bar button,.cap{font-size:13px;padding:5px 12px;border:1px solid var(--line);background:var(--bar);color:var(--fg);border-radius:8px;white-space:nowrap}
#bar button:hover:not(:disabled){background:var(--soft)}
#bar button:disabled{opacity:.4}
#modeTag{display:none;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--work) 14%,transparent);color:var(--work);white-space:nowrap;letter-spacing:.02em}
body.work #modeTag{display:inline-block}
body.work header{box-shadow:inset 0 -2px 0 var(--work)}
#bMode.on{border-color:color-mix(in srgb,var(--work) 50%,transparent);color:var(--work);background:color-mix(in srgb,var(--work) 8%,transparent)}
#menu{display:none;font-size:18px;padding:2px 10px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px}

/* 两个 AI 的胶囊：名字前一个色点，在想时会呼吸 */
.cap .cn{font-weight:600}
.cap .cn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--faint)}
#capClaude .cn::before{background:var(--claude)}
#capCodex .cn::before{background:var(--codex)}
.cap .cm,.cap .cs,.cap .cx{color:var(--mut)}
.cap .cm::before,.cap .cs::before,.cap .cx::before{content:" · "}
.cap .cx.hi{color:var(--danger);font-weight:600}
.cap.off .cs{color:var(--faint)}
.cap.term{border-color:color-mix(in srgb,var(--work) 50%,transparent)}.cap.term .cs{color:var(--work);font-weight:600}
.cap.think .cs{color:var(--btn);font-weight:600}
.cap.think .cn::before{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

/* ===== 弹窗 ===== */
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#mbox{background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:480px;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}to{transform:none;opacity:1}}
#mbox h3{margin:0 0 10px;font-size:16px;font-weight:650;letter-spacing:-.01em}
#mbox input,#mbox textarea,#mbox select,#mbox .mi{width:100%;font-size:15px;font-family:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
#mbox input:focus,#mbox textarea:focus,#mbox select:focus{outline:0;border-color:var(--btn);box-shadow:0 0 0 3px color-mix(in srgb,var(--btn) 18%,transparent)}
#mbox textarea{min-height:90px;max-height:40vh}
#mbox .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#mbox button{font-size:14px;padding:7px 16px;border:1px solid var(--line);background:var(--bar);color:var(--fg);border-radius:9px}
#mbox button:hover:not(:disabled){background:var(--soft)}
#mbox button.pri{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);font-weight:600}
#mbox button.pri:hover:not(:disabled){background:color-mix(in srgb,var(--btn) 88%,#000)}
#mbox button:disabled{opacity:.4}
#mbox .item{padding:10px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
#mbox .item:hover{background:var(--soft)}
#mbox .item small{color:var(--mut);white-space:nowrap}
#mbox .item .tt{flex:1;min-width:0;word-break:break-all}
#mbox .item .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#mbox .item .acts button{font-size:12px;padding:3px 10px;border-radius:7px}
#mbox .item.arch{opacity:.5}
#mbox code{display:block;background:var(--code);border:1px solid var(--line);padding:9px 11px;border-radius:9px;font:12.5px/1.45 var(--mono);word-break:break-all;margin:6px 0 12px}
#mbox .hint{font-size:13px;color:var(--mut);margin:4px 0 10px;line-height:1.5}

/* ===== 公告 / 看板 ===== */
#ann{background:var(--side);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px}
#ann .top{display:flex;gap:8px;align-items:flex-start}
#annText{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;line-height:1.55}
#ann.open #annText{display:block;max-height:40vh;overflow-y:auto;color:var(--fg)}
#ann button{font-size:12.5px;padding:3px 10px;border:1px solid var(--line);background:var(--bar);color:var(--fg);border-radius:7px;flex:none}
#ann button:hover{background:var(--soft)}
#annEdit{display:none}
#annEdit textarea{width:100%;font-size:15px;min-height:110px;max-height:40vh;border-radius:10px}
#annEdit .btns{display:flex;gap:8px;margin-top:8px}
#boardBtn{display:inline-block}
#board{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
#ann.open #board{display:block}
#boardList{list-style:none;margin:0 0 8px;padding:0;max-height:40vh;overflow-y:auto}
#boardList li{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:8px}
#boardList li:hover{background:var(--hover)}
#boardList li .bt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
#boardList li .bt small{color:var(--faint);margin-left:6px;font-size:11.5px}
#boardList li.done .bt{text-decoration:line-through;color:var(--faint)}
#boardList li .pin{flex:none;width:16px;text-align:center;font-size:12px}
#boardList li input{margin:4px 0 0;flex:none;accent-color:var(--btn)}
#boardList li .bx{border:0 !important;background:transparent !important;padding:0 4px !important;color:var(--faint) !important;font-size:16px !important;line-height:1;opacity:0}
#boardList li:hover .bx{opacity:1}
@media(hover:none){#boardList li .bx{opacity:1}}
#boardList .empty{color:var(--faint)}
#board .badd{display:flex;gap:6px;align-items:center}
#board .badd select,#board .badd input{font-size:15px;font-family:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#board .badd input{flex:1;min-width:0}

/* ===== 消息流：AI 左对齐带色块头像，你的话靠右浅色气泡，系统消息是居中小字 ===== */
#feed{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 12px;-webkit-overflow-scrolling:touch}
.msg{position:relative;margin:0 0 18px;word-break:break-word;overflow-wrap:anywhere}
.msg .who{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--faint);margin-bottom:2px;line-height:1.4}
.msg .who .nm{font-weight:650;font-size:13.5px;color:var(--fg)}
.msg .body{white-space:pre-wrap}
.msg .body.md{white-space:normal}
.msg.claude,.msg.codex{padding:2px 0 2px 40px}
.msg.claude::before,.msg.codex::before{position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--font);color:#fff}
.msg.claude::before{content:"C";background:var(--claude)}
.msg.codex::before{content:"X";background:var(--codex)}
.msg.claude .nm{color:var(--claude)}
.msg.codex .nm{color:var(--codex)}
.msg.me{margin-left:auto;max-width:80%;width:fit-content;background:var(--me);border:1px solid var(--me-line);padding:8px 14px 10px;border-radius:18px 18px 6px 18px}
.msg.me .who{justify-content:flex-end}
.msg.me .who .nm{display:none}
.msg.sys{margin:4px auto 18px;width:fit-content;max-width:90%;font-size:12.5px;color:var(--mut);text-align:center;background:var(--soft);padding:3px 12px;border-radius:999px;line-height:1.5}
.msg.touser{background:color-mix(in srgb,var(--work) 7%,transparent);border-radius:12px;padding:10px 12px 10px 52px;box-shadow:inset 3px 0 0 var(--work)}
.msg.touser::before{left:12px;top:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--work);background:color-mix(in srgb,var(--work) 14%,transparent);padding:0 7px;border-radius:999px;line-height:1.6}
.msg.step{text-align:left}
.undo{margin-top:8px;font-size:12.5px;padding:4px 12px;border:1px solid color-mix(in srgb,var(--work) 45%,transparent);background:transparent;color:var(--work);border-radius:7px;font-weight:600}
.undo:hover:not(:disabled){background:color-mix(in srgb,var(--work) 10%,transparent)}
.undo:disabled{opacity:.5;border-color:var(--line);color:var(--mut);font-weight:400}
.msg.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%,40%{background-color:color-mix(in srgb,var(--btn) 16%,transparent)}100%{background-color:transparent}}
.msg.me.flash{animation:none;outline:2px solid var(--btn);outline-offset:2px}

/* markdown */
.md p{margin:0 0 10px}
.md>:last-child{margin-bottom:0}
.md h3,.md h4,.md h5,.md h6{margin:14px 0 6px;line-height:1.35;font-weight:650}
.md h3{font-size:1.15em}.md h4{font-size:1.07em}.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:3px 0}
.md li::marker{color:var(--faint)}
.md blockquote{margin:0 0 10px;padding:2px 12px;border-left:3px solid var(--line);color:var(--mut)}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.md code{padding:1px 6px;background:var(--soft);border:1px solid var(--line);border-radius:5px;font:.88em var(--mono)}
.md a{color:var(--btn);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--btn) 35%,transparent)}
.md a:hover{border-bottom-color:var(--btn)}
.md strong{font-weight:650}
.md .tbl{overflow-x:auto;margin:0 0 10px;border:1px solid var(--line);border-radius:10px}
.md table{border-collapse:collapse;font-size:.93em;width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:6px 12px;text-align:left;vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md th{background:var(--soft);font-weight:600}
.msg pre{margin:8px 0;padding:12px 14px;background:var(--code);border:1px solid var(--line);border-radius:10px;overflow-x:auto;white-space:pre;font:13px/1.5 var(--mono);max-width:100%}

/* 附件 */
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.atts img{max-width:180px;max-height:180px;border-radius:10px;display:block;border:1px solid var(--line)}
.atts audio{max-width:100%}
.atts a.file{font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--bar);border-radius:9px;color:inherit;text-decoration:none;word-break:break-all}
.atts a.file:hover{background:var(--soft)}

/* 引用 */
.who .rp{border:0;background:transparent;color:var(--faint);font-size:12px;padding:0 4px;margin-left:auto;cursor:pointer}
.who .rp:hover{color:var(--btn)}
.qt{border-left:2px solid var(--faint);padding:0 10px;margin:4px 0 6px;font-size:12.5px;color:var(--mut);cursor:pointer;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.qt:hover{color:var(--fg)}
#quote{display:none;align-items:flex-start;gap:6px;border-left:2px solid var(--btn);background:var(--soft);border-radius:8px;padding:6px 6px 6px 10px;margin-bottom:8px;font-size:13px;color:var(--mut)}
#quote.on{display:flex}
#quote .qtx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#quote button{border:0;background:transparent;color:var(--mut);font-size:18px;line-height:1;padding:0 4px}
#cmenu{display:none;position:fixed;z-index:60;min-width:160px;background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;font-size:14px}
#cmenu.on{display:block;animation:pop .12s ease-out}
#cmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:7px 12px;border-radius:7px;font-size:14px}
#cmenu button:hover{background:var(--soft)}
@media(hover:hover) and (pointer:fine){.who .rp{display:none}}

/* 跳到我的发言：聊天区右下角两个圆按钮 */
#jump{position:fixed;z-index:15;display:none;flex-direction:column;gap:6px}
#jump.on{display:flex}
#jump button{width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--bar) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--mut);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#jump button:hover{color:var(--fg);border-color:color-mix(in srgb,var(--btn) 40%,var(--line))}
#jump button:active{transform:scale(.92)}
#jump button.dim{opacity:.45}
#jump svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 状态行 ===== */
#status{display:none;padding:6px 16px;font-size:13px;color:var(--mut);background:var(--bg)}
#status.on{display:flex;align-items:center;gap:10px}
#stMain{flex:1;min-width:0}
#stText{display:flex;align-items:center;gap:8px}
#stLive .ln{margin:3px 0 0 15px;font-size:12.5px;line-height:1.5;color:var(--fg);opacity:.8;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;white-space:pre-wrap}
#stLive .ln.open{-webkit-line-clamp:unset;max-height:30vh;overflow-y:auto}
#stLive .ln b{font-weight:600;margin-right:6px}#stLive .ln .t{color:var(--faint);margin-right:6px}
#stLive .ln.claude b{color:var(--claude)}#stLive .ln.codex b{color:var(--codex)}
#stText::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--btn);animation:pulse 1.2s ease-in-out infinite}
#stops{display:flex;gap:6px;flex:none}
#stops button{font-size:12.5px;font-weight:600;padding:3px 12px;border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);background:transparent;color:var(--danger);border-radius:7px;white-space:nowrap}
#stops button:hover,#stops button:active{background:var(--danger);color:#fff;border-color:var(--danger)}

/* ===== 输入区：一张圆角卡片 ===== */
footer{background:var(--bg);padding:6px 12px calc(12px + env(safe-area-inset-bottom))}
body.drag footer .row{outline:2px dashed var(--btn);outline-offset:3px}
.quick{display:flex;gap:6px;margin-bottom:8px}
.quick button{font-size:12.5px;padding:3px 10px;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px}
.quick button:hover{color:var(--fg);background:var(--soft)}
#pend{display:none;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{position:relative;border:1px solid var(--line);background:var(--bar);border-radius:10px;padding:5px 26px 5px 8px;font-size:12px;max-width:100%;display:flex;align-items:center;gap:8px;word-break:break-all}
.chip img{width:44px;height:44px;object-fit:cover;border-radius:7px}
.chip .x{position:absolute;top:1px;right:2px;border:0;background:transparent;color:var(--mut);font-size:18px;line-height:1;padding:2px 4px}
.row{display:flex;gap:6px;align-items:flex-end;background:var(--bar);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.row:focus-within{border-color:color-mix(in srgb,var(--btn) 55%,var(--line));box-shadow:var(--shadow),0 0 0 3px color-mix(in srgb,var(--btn) 12%,transparent)}
textarea{flex:1;min-width:0;font-size:15px;font-family:inherit;line-height:1.5;padding:7px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:none;max-height:160px}
.row textarea{border:0;background:transparent;outline:0}
#clip{font-size:18px;width:38px;height:38px;padding:0;border:0;background:transparent;color:var(--mut);border-radius:10px;flex:none}
#clip:hover{background:var(--soft);color:var(--fg)}
#send{font-size:14px;font-weight:600;height:38px;padding:0 18px;border:0;border-radius:11px;background:var(--btn);color:var(--btn-fg);flex:none}
#send:hover{background:color-mix(in srgb,var(--btn) 88%,#000)}

/* ===== 平板 / 窄电脑窗口：内容居中，行不拉太长 ===== */
@media(min-width:601px){
  #feed{padding:20px max(20px,calc((100% - 820px)/2))}
  #status{padding-left:max(20px,calc((100% - 820px)/2));padding-right:max(20px,calc((100% - 820px)/2))}
  footer{padding:6px max(16px,calc((100% - 820px)/2)) calc(16px + env(safe-area-inset-bottom))}
  .atts img{max-width:240px;max-height:240px}
}

/* ===== 电脑：左边栏（标题、两个 AI、按钮、完整公告）+ 右边聊天 ===== */
@media(min-width:1000px){
  body{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
       grid-template-areas:"head feed" "ann feed" "ann status" "ann foot"}
  header{grid-area:head;flex-direction:column;align-items:stretch;gap:14px;padding:22px 18px 16px;border-bottom:0;border-right:1px solid var(--line);background:var(--side);backdrop-filter:none;-webkit-backdrop-filter:none}
  body.work header{box-shadow:inset 0 3px 0 var(--work)}
  #title{white-space:normal;font-size:18px;line-height:1.35}
  #modeTag{align-self:flex-start;margin-top:-6px}
  #wd{display:block;margin-top:-8px}
  #title .wdn{display:none}
  #bar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #bar button{font-size:13.5px;padding:7px 10px;border-radius:9px}
  #bar .cap{grid-column:1/-1;text-align:left;white-space:normal;line-height:1.45;padding:10px 12px;border-radius:11px;box-shadow:var(--shadow)}
  #bar #capClaude{margin-top:6px}
  #bar .cap .cm,#bar .cap .cs,#bar .cap .cx{display:block;font-size:12px;padding-left:15px}
  #bar .cap .cm::before,#bar .cap .cs::before,#bar .cap .cx::before{content:none}
  #bar .cap.off .cn{color:var(--fg)}
  #ann{grid-area:ann;border-bottom:0;border-right:1px solid var(--line);padding:4px 18px 18px;overflow-y:auto;font-size:13.5px}
  #ann::before{content:"公告";display:block;font-size:11.5px;font-weight:600;color:var(--faint);margin:8px 0;letter-spacing:.08em}
  #ann .top{flex-direction:column;align-items:stretch;gap:8px}
  #annText,#ann.open #annText{display:block;-webkit-line-clamp:unset;overflow:visible;max-height:none;color:var(--fg);cursor:default}
  #ann button{align-self:flex-start}
  #boardBtn{display:none !important}
  #board{display:block;margin-top:18px;padding-top:14px}
  #board::before{content:"看板";display:block;font-size:11.5px;font-weight:600;color:var(--faint);margin-bottom:8px;letter-spacing:.08em}
  #boardList{max-height:none}
  #board .badd select,#board .badd input{font-size:13.5px}
  #annEdit textarea{min-height:240px;max-height:60vh;font-size:14px}
  #feed{grid-area:feed;padding:28px max(32px,calc((100% - 820px)/2))}
  #status{grid-area:status;padding-left:max(32px,calc((100% - 820px)/2));padding-right:max(32px,calc((100% - 820px)/2))}
  footer{grid-area:foot;padding:6px max(32px,calc((100% - 820px)/2)) 20px}
  .msg.me{max-width:72%}
}

/* ===== 手机 ===== */
@media(max-width:600px){
  header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  #title{font-size:15.5px}
  #menu{display:block;min-height:34px}
  #bar{display:none;position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.14)}
  #bar.show{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
  #bar button{font-size:15px;padding:10px;border-radius:10px}
  #bar .cap{grid-column:1/-1;text-align:left}
  .cap .cm{display:none}
  #ann{padding:6px 12px}
  #feed{padding:14px 12px}
  .msg.claude,.msg.codex{padding-left:34px}
  .msg.claude::before,.msg.codex::before{width:24px;height:24px;font-size:12px;border-radius:7px}
  .msg.touser{padding-left:44px}
  .msg.me{max-width:88%}
  .md table{font-size:.88em}
  .atts img{max-width:140px;max-height:140px}
  footer{padding:4px 8px calc(8px + env(safe-area-inset-bottom))}
  .quick{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .quick::-webkit-scrollbar{display:none}
  .quick button{flex:none;padding:5px 12px;font-size:13.5px}
  textarea{font-size:16px}
  #clip,#send{height:40px}
  .undo{padding:6px 12px}
  #stops button{padding:6px 12px;font-size:13.5px}
  .who .rp{font-size:13px;padding:2px 6px}
  #jump button{width:32px;height:32px;opacity:.85}
  #jump button.dim{opacity:.35}
}

</head>
<body>
<header>
  <div id="title">会议室</div><div id="wd"></div><span id="modeTag">干活模式</span>
  <button type="button" id="menu" aria-label="菜单">&#9776;</button>
  <div id="bar">
    <button type="button" id="bList">会议列表</button><button type="button" id="bNew">新会议</button><button type="button" id="bMode">讨论模式</button><button type="button" id="bWrap">落盘</button>
    <button type="button" class="cap" id="capClaude">claude</button><button type="button" class="cap" id="capCodex">codex</button>
  </div>
</header>
<div id="modal"><div id="mbox"></div></div>
<div id="cmenu"></div>
<div id="ann">
  <div class="top"><div id="annText">（暂无公告）</div><button type="button" id="boardBtn">看板</button><button type="button" id="annBtn">编辑</button></div>
  <div id="annEdit"><textarea id="annTa" placeholder="当前任务公告…"></textarea>
    <div class="btns"><button type="button" id="annSave">保存</button><button type="button" id="annCancel">取消</button></div></div>
  <div id="board"><ul id="boardList"></ul>
    <div class="badd"><select id="bKind"><option value="todo">待办</option><option value="note">公告</option></select><input id="bText" maxlength="500" placeholder="加一条…"><button type="button" id="bAdd">加</button></div></div>
</div>
<div id="feed"></div>
<div id="jump"><button type="button" id="jUp" title="上一条我的发言（长按：到顶）" aria-label="上一条我的发言"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button type="button" id="jDn" title="下一条我的发言（长按：到底）" aria-label="下一条我的发言"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div id="status"><div id="stMain"><span id="stText"></span><div id="stLive"></div></div><span id="stops"></span></div>
<footer>
  <div class="quick"><button type="button" data-ins="@claude ">@claude</button><button type="button" data-ins="@codex ">@codex</button><button type="button" data-ins="@用户 ">@用户</button></div>
  <div id="quote"><span class="qtx"></span><button type="button" id="quoteX" aria-label="取消引用">&times;</button></div>
  <div id="pend"></div>
  <div class="row"><button id="clip" type="button" aria-label="添加附件">&#128206;</button><input type="file" id="file" multiple hidden><textarea id="ta" rows="1" placeholder="说点什么…"></textarea><button id="send" type="button">发送</button></div>
</footer>
<script>
(function(){const m=document.querySelector('meta[name=rt-token]'),t=m?m.content:'';if(!t||t==='__RT_TOKEN__')return;const f=window.fetch;window.fetch=function(u,o){o=o||{};const h=new Headers(o.headers||{});h.set('X-RT-Token',t);o.headers=h;return f.call(this,u,o)}})();
const feed=document.getElementById('feed'),ta=document.getElementById('ta'),st=document.getElementById('status');
const touch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
let since=0,curMeeting=undefined,S=null;
const msgById={};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(t,md){
  const parts=t.split('```');let h='';
  parts.forEach((p,i)=>{
    if(i%2){h+='<pre>'+esc(p.replace(/^[^\n]*\n/,''))+'</pre>'}
    else h+=md?mdBlock(p):esc(p);
  });
  return h;
}
// 简易 markdown：先转义再套标签，只出现下面写死的几种标签；链接只认 http(s)
function mdInline(s){
  const hold=[];
  const keep=h=>{hold.push(h);return '\u0000'+(hold.length-1)+'\u0000'};
  s=s.replace(/`([^`\n]+)`/g,(_,c)=>keep('<code>'+esc(c)+'</code>'));
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,tx,u)=>keep('<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(tx)+'</a>'));
  s=s.replace(/(^|[^"\w\u0000])(https?:\/\/[^\s<>\u0000]+?)([.,;:!?)）。，；：！？]*(?:\s|$))/g,(_,a,u,z)=>a+keep('<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>')+z);
  s=esc(s);
  s=s.replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>').replace(/~~([^~\n]+?)~~/g,'<del>$1</del>');
  s=s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?![*\w])/g,'$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g,(_,n)=>hold[+n]);
}
function mdBlock(t){
  const L=t.replace(/\r/g,'').split('\n');let h='',i=0;const para=[];
  const flush=()=>{if(para.length){h+='<p>'+para.map(mdInline).join('<br>')+'</p>';para.length=0}};
  const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
  const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l)&&l.indexOf('-')>=0;
  const LI=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  while(i<L.length){
    const l=L[i];let m;
    if(!l.trim()){flush();i++;continue}
    if(m=l.match(/^(#{1,6})\s+(.*)$/)){flush();const n=Math.min(m[1].length+2,6);h+='<h'+n+'>'+mdInline(m[2])+'</h'+n+'>';i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){flush();h+='<hr>';i++;continue}
    if(/^\s*>/.test(l)){flush();const q=[];while(i<L.length&&/^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++}h+='<blockquote>'+mdBlock(q.join('\n'))+'</blockquote>';continue}
    if(isRow(l)&&i+1<L.length&&isSep(L[i+1])){
      flush();const hd=cells(l);i+=2;let b='';
      while(i<L.length&&isRow(L[i])){b+='<tr>'+cells(L[i]).map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>';i++}
      h+='<div class="tbl"><table><thead><tr>'+hd.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>'+b+'</tbody></table></div>';continue;
    }
    if(m=l.match(LI)){
      flush();const items=[];
      while(i<L.length){
        const x=L[i].match(LI);
        if(x){items.push({ind:x[1].replace(/\t/g,'    ').length,ol:/\d/.test(x[2]),text:x[3]});i++}
        else if(L[i].trim()&&/^\s+/.test(L[i])&&items.length){items[items.length-1].text+='\n'+L[i].trim();i++}
        else if(!L[i].trim()&&i+1<L.length&&LI.test(L[i+1])){i++}
        else break;
      }
      let o='';const st=[];
      for(const it of items){
        while(st.length&&it.ind<st[st.length-1].ind)o+='</li></'+st.pop().tag+'>';
        const top=st[st.length-1];
        const tag=it.ol?'ol':'ul';
        if(!top||it.ind>top.ind){o+='<'+tag+'><li>';st.push({ind:it.ind,tag})}
        else if(top.tag!==tag){o+='</li></'+top.tag+'><'+tag+'><li>';top.tag=tag}   // 同级换了类型（无序 → 有序）另起一个列表
        else o+='</li><li>';
        o+=it.text.split('\n').map(mdInline).join('<br>');
      }
      while(st.length)o+='</li></'+st.pop().tag+'>';
      h+=o;continue;
    }
    para.push(l);i++;
  }
  flush();return h;
}
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function attHtml(list){
  if(!list||!list.length)return '';
  return '<div class="atts">'+list.map(a=>{
    const u=esc(a.url||''),n=esc(a.name);
    if(a.kind==='image')return '<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="'+n+'" loading="lazy"></a>';
    if(a.kind==='audio')return '<audio controls preload="none" src="'+u+'"></audio>';
    return '<a class="file" href="'+u+'" download="'+n+'">'+n+' · '+fmtSize(a.size)+'</a>';
  }).join('')+'</div>';
}
function add(m){
  const d=document.createElement('div');
  const cls=m.speaker==='你'?'me':m.speaker==='claude'?'claude':m.speaker==='codex'?'codex':'sys';
  d.className='msg '+cls+(m.to_user?' touser':'')+(m.step!=null?' step':'');
  const tag=m.to_user?'<span class="tag">→ 用户</span>':'';
  const who=cls==='sys'?'':'<div class="who"><span class="nm">'+esc(m.speaker)+'</span><span class="tm">'+esc(m.time)+'</span>'+tag+'<button type="button" class="rp" title="引用回复">↩ 引用</button></div>';
  const q=m.reply_to?'<div class="qt" data-to="'+m.reply_to.id+'">'+esc(m.reply_to.speaker)+'：'+(m.reply_to.part?'“'+esc(m.reply_to.text)+'”':esc(m.reply_to.text))+'</div>':'';
  d.dataset.id=m.id;msgById[m.id]=m;
  const md=cls==='claude'||cls==='codex';
  d.innerHTML=who+q+(m.text?'<div class="body'+(md?' md':'')+'">'+render(m.text,md)+'</div>':'')+attHtml(m.attachments)+(m.step!=null?'<button type="button" class="undo" data-step="'+m.step+'">撤回这一步</button>':'');
  feed.appendChild(d);
  const ub=d.querySelector('.undo');if(ub){ub.onclick=()=>undoStep(m.step);syncUndo()}
  const rb=d.querySelector('.rp');if(rb)rb.onclick=()=>{const sel=lastSel&&lastSel.id===m.id&&Date.now()-lastSel.t<15000?lastSel.text:'';setQuote(m,sel)};
  const qb=d.querySelector('.qt');if(qb)qb.onclick=()=>{const o=feed.querySelector('.msg[data-id="'+qb.dataset.to+'"]');if(o){o.scrollIntoView({block:'center',behavior:'smooth'});o.classList.add('flash');setTimeout(()=>o.classList.remove('flash'),1200)}};
}
// 状态行：谁在想、想了多久，下面是它这一轮最近说的一句中途的话（不进会议记录，点一下展开）
let lastRun={running:[],queued:0};
const stLive=document.getElementById('stLive');
const openLive=new Set();
stLive.onclick=e=>{const l=e.target.closest('.ln');if(!l)return;const a=l.dataset.ai;openLive.has(a)?openLive.delete(a):openLive.add(a);l.classList.toggle('open')};
function fmtDur(s){return s<60?s+' 秒':s<3600?Math.floor(s/60)+' 分钟':Math.floor(s/3600)+' 小时 '+Math.floor(s%3600/60)+' 分'}
function drawStatus(){
  const lv=(S&&S.live)||{};
  const rn=lastRun.running.map(x=>x.startsWith('compact:')?x.slice(8)+' 正在压缩':x==='compact'?'正在压缩':x+' 正在想'+(lv[x]&&lv[x].secs>=60?'（'+fmtDur(lv[x].secs)+'）':''));
  const stT=document.getElementById('stText');
  if(rn.length){st.classList.add('on');stT.textContent=rn.join('，')+'…'+(lastRun.queued?' · 排队 '+lastRun.queued+' 条':'')}
  else if(lastRun.queued){st.classList.add('on');stT.textContent='队列还有 '+lastRun.queued+' 条'}
  else st.classList.remove('on');
  const h=Object.keys(lv).filter(a=>lv[a].text&&lastRun.running.includes(a)).map(a=>'<div class="ln '+esc(a)+(openLive.has(a)?' open':'')+'" data-ai="'+esc(a)+'" title="点一下展开 / 收起"><b>'+esc(a)+'</b><span class="t">'+esc(lv[a].time.slice(0,5))+'</span>'+esc(lv[a].text)+'</div>').join('');
  if(stLive.innerHTML!==h)stLive.innerHTML=h;
}
async function poll(){
  try{
    const r=await fetch('/api/messages?since='+since,{cache:'no-store'});
    const j=await r.json();
    if(j.meeting!==curMeeting){curMeeting=j.meeting;feed.innerHTML='';if(since!==0||j.messages.length<j.next){since=0;return poll()}}
    const atBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<60;
    j.messages.forEach(add);since=j.next;
    if(j.messages.length&&atBottom)feed.scrollTop=feed.scrollHeight;
    lastRun={running:j.running||[],queued:j.queued||0};
  }catch(e){}
  await loadState();
  drawStatus();
}
// 附件
let pend=[],uploading=0;
const pendEl=document.getElementById('pend'),fileEl=document.getElementById('file');
function drawPend(){
  pendEl.innerHTML='';pendEl.style.display=(pend.length||uploading)?'flex':'none';
  pend.forEach((a,i)=>{
    const c=document.createElement('div');c.className='chip';
    c.innerHTML=(a.kind==='image'?'<img src="'+esc(a.url)+'">':'')+'<span>'+esc(a.name)+'</span><button class="x" type="button">&times;</button>';
    c.querySelector('.x').onclick=()=>{pend.splice(i,1);drawPend()};
    pendEl.appendChild(c);
  });
  if(uploading){const c=document.createElement('div');c.className='chip';c.textContent='上传中 '+uploading+' 个…';pendEl.appendChild(c)}
}
async function upload(f){
  uploading++;drawPend();
  try{
    const r=await fetch('/api/upload?name='+encodeURIComponent(f.name||'file'),{method:'POST',body:f});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||r.status);
    pend.push(j);
  }catch(e){alert('上传失败：'+f.name+'\n'+e.message)}
  uploading--;drawPend();
}
document.getElementById('clip').onclick=()=>fileEl.click();
// 粘贴：剪贴板里有图片 / 文件就当附件传；同时有文字时文字照常粘
ta.addEventListener('paste',e=>{
  const cd=e.clipboardData;if(!cd)return;
  const fs=[...cd.items].filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);
  if(!fs.length)return;
  if(!cd.getData('text/plain'))e.preventDefault();
  const t=new Date(),stamp=[t.getHours(),t.getMinutes(),t.getSeconds()].map(n=>String(n).padStart(2,'0')).join('');
  (async()=>{for(let i=0;i<fs.length;i++){let f=fs[i];
    if(!f.name||/^image\.\w+$/i.test(f.name)){const ext=(f.type.split('/')[1]||'png').replace('jpeg','jpg');f=new File([f],'粘贴_'+stamp+(fs.length>1?'_'+(i+1):'')+'.'+ext,{type:f.type})}
    await upload(f)}})();
});
// 拖文件到页面上也行
let dragN=0;
document.addEventListener('dragenter',e=>{if([...(e.dataTransfer||{}).types||[]].includes('Files')){dragN++;document.body.classList.add('drag')}});
document.addEventListener('dragleave',()=>{if(dragN&&!--dragN)document.body.classList.remove('drag')});
document.addEventListener('dragover',e=>{if([...(e.dataTransfer||{}).types||[]].includes('Files'))e.preventDefault()});
document.addEventListener('drop',async e=>{
  if(!e.dataTransfer||!e.dataTransfer.files.length)return;
  e.preventDefault();dragN=0;document.body.classList.remove('drag');
  for(const f of [...e.dataTransfer.files])await upload(f);
});
// 引用回复
let quote=null;
const quoteEl=document.getElementById('quote');
function setQuote(m,part){
  if(!m){quote=null;quoteEl.classList.remove('on');return}
  part=(part||'').replace(/\s+/g,' ').trim();
  if(part){quote={id:m.id,speaker:m.speaker,part};quoteEl.querySelector('.qtx').textContent='回复 '+m.speaker+' 这段：“'+part+'”';quoteEl.classList.add('on');ta.focus();return}
  const t=(m.text||'').replace(/\*\*|__|~~|`+/g,'').replace(/^\s*(#+|[-*>])\s+/gm,'').replace(/\s+/g,' ').trim()||((m.attachments||[]).length?'（附件）':'');
  quote={id:m.id,speaker:m.speaker};
  quoteEl.querySelector('.qtx').textContent='回复 '+m.speaker+'：'+t;
  quoteEl.classList.add('on');ta.focus();
}
document.getElementById('quoteX').onclick=()=>setQuote(null);
// 选中的文字落在哪条消息里
function selIn(){
  const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return null;
  const text=sel.toString().trim();if(!text)return null;
  const a=sel.getRangeAt(0).commonAncestorContainer;
  const el=(a.nodeType===1?a:a.parentElement).closest('.msg[data-id]');
  if(!el)return null;
  return {id:+el.dataset.id,text};
}
let lastSel=null;
document.addEventListener('selectionchange',()=>{const x=selIn();if(x)lastSel={...x,t:Date.now()}});
const cmenu=document.getElementById('cmenu');
function hideMenu(){cmenu.classList.remove('on')}
feed.addEventListener('contextmenu',e=>{
  const el=e.target.closest('.msg[data-id]');if(!el)return;
  const m=msgById[+el.dataset.id];if(!m||!['你','claude','codex'].includes(m.speaker))return;
  const x=selIn(),part=x&&x.id===m.id?x.text:'';
  e.preventDefault();
  const items=[];
  if(part){items.push(['引用这段回复',()=>setQuote(m,part)]);items.push(['复制',()=>navigator.clipboard&&navigator.clipboard.writeText(part).catch(()=>{})])}
  items.push(['引用整条回复',()=>setQuote(m)]);
  cmenu.innerHTML='';
  items.forEach(([t,f])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>{hideMenu();f()};cmenu.appendChild(b)});
  cmenu.classList.add('on');
  const w=cmenu.offsetWidth,h=cmenu.offsetHeight;
  cmenu.style.left=Math.max(4,Math.min(e.clientX,innerWidth-w-4))+'px';
  cmenu.style.top=Math.max(4,Math.min(e.clientY,innerHeight-h-4))+'px';
});
document.addEventListener('mousedown',e=>{if(!cmenu.contains(e.target))hideMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideMenu()});
feed.addEventListener('scroll',hideMenu);
fileEl.onchange=async()=>{const fs=[...fileEl.files];fileEl.value='';for(const f of fs)await upload(f)};
async function send(){
  const text=ta.value.trim();
  if(uploading){alert('附件还在上传，稍等一下');return}
  if(!text&&!pend.length)return;
  const atts=pend,qm=quote;
  ta.value='';ta.style.height='auto';pend=[];drawPend();quote=null;quoteEl.classList.remove('on');
  try{
    const body={text,attachments:atts.map(a=>({path:a.path,kind:a.kind}))};
    if(qm){body.reply_to=qm.id;if(qm.part)body.reply_part=qm.part}
    const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

// 平滑滚动；页面在后台等情况下动画不走，就直接跳过去
function scrollFeed(top){
  const from=feed.scrollTop;top=Math.max(0,Math.min(top,feed.scrollHeight-feed.clientHeight));
  feed.scrollTo({top,behavior:'smooth'});
  setTimeout(()=>{if(Math.abs(feed.scrollTop-from)<1&&Math.abs(top-from)>1)feed.scrollTop=top},400);
}
function goTo(el){
  scrollFeed(feed.scrollTop+el.getBoundingClientRect().top-feedTop());
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1200);
}
function syncJump(){
  const scrollable=feed.scrollHeight>feed.clientHeight+20;
  jumpEl.classList.toggle('on',scrollable);
  if(!scrollable)return;
  // 两边都在：位置跟着聊天区右边、输入区（和状态行）上面
  const fr=feed.getBoundingClientRect();
  jumpEl.style.right=Math.max(8,innerWidth-fr.right+16)+'px';
  jumpEl.style.bottom=Math.max(8,innerHeight-fr.bottom+12)+'px';
  jUp.classList.toggle('dim',!prevMine()&&feed.scrollTop<4);
  jDn.classList.toggle('dim',atEnd());
}
function holdable(btn,onTap,onHold){
  let timer=null,held=false;
  const clear=()=>{clearTimeout(timer);timer=null};
  btn.addEventListener('pointerdown',e=>{if(e.button)return;held=false;clear();timer=setTimeout(()=>{held=true;timer=null;onHold();if(navigator.vibrate)navigator.vibrate(15)},500)});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>btn.addEventListener(t,clear));
  btn.addEventListener('click',e=>{if(held){held=false;e.preventDefault();return}onTap()});
  btn.addEventListener('contextmenu',e=>e.preventDefault());   // 手机长按别弹菜单
}
holdable(jUp,()=>{const el=prevMine();if(el)goTo(el);else scrollFeed(0)},()=>scrollFeed(0));
holdable(jDn,()=>{const el=nextMine();if(el)goTo(el);else scrollFeed(feed.scrollHeight)},()=>scrollFeed(feed.scrollHeight));
let jumpRaf=0;
const queueJump=()=>{if(!jumpRaf)jumpRaf=requestAnimationFrame(()=>{jumpRaf=0;syncJump()})};
feed.addEventListener('scroll',queueJump);addEventListener('resize',queueJump);
if(window.ResizeObserver){const ro=new ResizeObserver(queueJump);ro.observe(feed);ro.observe(document.querySelector('footer'))}
setInterval(queueJump,1500);
poll().then(()=>{feed.scrollTop=feed.scrollHeight;queueJump()});setInterval(poll,1500);
</script>
