<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Bridge">
<meta name="color-scheme" content="light dark">
<meta name="rt-token" content="__RT_TOKEN__">
<meta name="theme-color" content="#1b1b1e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>会议室</title>
<style>
/* ===== 颜色 / 字体：浅色默认，深色跟系统 ===== */
:root{
  --bg:#ffffff;--side:#f7f7f8;--bar:#ffffff;--fg:#18181b;--mut:#71717a;--faint:#a1a1aa;--line:#e7e7ea;--soft:#f3f3f5;--hover:rgba(24,24,27,.05);
  --btn:#2563eb;--btn-fg:#fff;--me:#eef3ff;--me-line:#dbe5ff;--code:#f6f6f8;
  --claude:#d97757;--codex:#10a37f;--work:#d97706;--danger:#dc2626;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);--shadow-lg:0 12px 40px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;--mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#151517;--side:#1b1b1e;--bar:#1b1b1e;--fg:#ececf1;--mut:#a1a1aa;--faint:#6b6b74;--line:#2c2c31;--soft:#232328;--hover:rgba(255,255,255,.05);
  --btn:#3b82f6;--me:#1e2a44;--me-line:#2a3a5c;--code:#0f0f11;
  --claude:#e5896a;--codex:#2fbf94;--work:#f59e0b;--danger:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;background:var(--bg);color:var(--fg);font:15px/1.6 var(--font);display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s,color .15s,opacity .15s}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px}

/* ===== 顶栏 ===== */
header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bar) 85%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:10}
#title{font-weight:650;font-size:16px;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#title .wdn{font-weight:400;color:var(--mut);font-size:.85em}
#wd{display:none;font-size:12px;color:var(--mut);word-break:break-all;line-height:1.4;font-family:var(--mono)}
#bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bar button,.cap{font-size:13px;padding:5px 12px;border:1px solid var(--line);background:var(--bar);color:var(--fg);border-radius:8px;white-space:nowrap}
#bar button:hover:not(:disabled){background:var(--soft)}
#bar button:disabled{opacity:.4}
#modeTag{display:none;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--work) 14%,transparent);color:var(--work);white-space:nowrap;letter-spacing:.02em}
body.work #modeTag{display:inline-block}
body.work header{box-shadow:inset 0 -2px 0 var(--work)}
#bMode.on{border-color:color-mix(in srgb,var(--work) 50%,transparent);color:var(--work);background:color-mix(in srgb,var(--work) 8%,transparent)}
#menu{display:none;font-size:18px;padding:2px 10px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px}

/* 两个 AI 的胶囊：名字前一个色点，在想时会呼吸 */
.cap .cn{font-weight:600}
.cap .cn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--faint)}
#capClaude .cn::before{background:var(--claude)}
#capCodex .cn::before{background:var(--codex)}
.cap .cm,.cap .cs,.cap .cx{color:var(--mut)}
.cap .cm::before,.cap .cs::before,.cap .cx::before{content:" · "}
.cap .cx.hi{color:var(--danger);font-weight:600}
.cap.off .cs{color:var(--faint)}
.cap.term{border-color:color-mix(in srgb,var(--work) 50%,transparent)}.cap.term .cs{color:var(--work);font-weight:600}
.cap.think .cs{color:var(--btn);font-weight:600}
.cap.think .cn::before{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

/* ===== 会议列表（电脑左边栏最上面；手机收进"会议列表"弹窗）===== */
#rooms{display:none}
.rl{list-style:none;margin:0;padding:0}
.rl li a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;color:var(--fg);text-decoration:none;font-size:13.5px;line-height:1.35}
.rl li a:hover{background:var(--hover)}
.rl li.cur a{background:var(--soft);font-weight:600}
.rl .dot{flex:none;width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--faint)}
.rl .dot.run{background:var(--btn);border-color:var(--btn);animation:pulse 1.2s ease-in-out infinite}
.rl .dot.you{background:var(--work);border-color:var(--work)}
.rl .dot.new{background:var(--faint);border-color:var(--faint)}
.rl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl .b{flex:none;font-size:11px;font-weight:600;padding:0 6px;border-radius:999px;line-height:1.6;background:var(--soft);color:var(--mut)}
.rl .b.you{background:color-mix(in srgb,var(--work) 16%,transparent);color:var(--work)}
.rl .b.run{background:color-mix(in srgb,var(--btn) 14%,transparent);color:var(--btn)}
.rl li.arch a{opacity:.55}
#menu.attn{position:relative}
#menu.attn::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--work)}

/* ===== 正在改的文件（文件护栏）===== */
#claims{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
#claims.on{display:block}
#claims .ch{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.08em;margin-bottom:6px}
#claims .ch button{margin-left:auto;font-size:11.5px;letter-spacing:0;font-weight:500}
#claimList{list-style:none;margin:0;padding:0}
#claimList li{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:8px;font-size:12.5px;line-height:1.45}
#claimList li:hover{background:var(--hover)}
#claimList .cf{flex:1;min-width:0;word-break:break-all}
#claimList .cf b{font-weight:600}
#claimList .cf small{display:block;color:var(--mut)}
#claimList .ai-claude b{color:var(--claude)}#claimList .ai-codex b{color:var(--codex)}
#claimList button{flex:none;font-size:11.5px !important;padding:1px 8px !important}

/* ===== 工具（MCP / 插件 / 技能）===== */
.tl{list-style:none;margin:0 0 10px;padding:0;max-height:30vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.tl li{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.tl li:last-child{border-bottom:0}
.tl input{margin:3px 0 0;flex:none;accent-color:var(--btn);width:auto !important}
.tl .tn{flex:1;min-width:0;word-break:break-all}
.tl .tn small{display:block;color:var(--mut);font-size:12px}
.tl .tg{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--soft);color:var(--mut);vertical-align:1px}
.tl li.lk{opacity:.6}
.tl .empty{color:var(--mut);justify-content:center}
#mbox h4{margin:12px 0 6px;font-size:13px;font-weight:650;color:var(--mut)}

/* ===== 弹窗 ===== */
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#mbox{background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:480px;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}to{transform:none;opacity:1}}
#mbox h3{margin:0 0 10px;font-size:16px;font-weight:650;letter-spacing:-.01em}
#mbox input,#mbox textarea,#mbox select,#mbox .mi{width:100%;font-size:15px;font-family:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
#mbox input:focus,#mbox textarea:focus,#mbox select:focus{outline:0;border-color:var(--btn);box-shadow:0 0 0 3px color-mix(in srgb,var(--btn) 18%,transparent)}
#mbox textarea{min-height:90px;max-height:40vh}
#mbox .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#mbox button{font-size:14px;padding:7px 16px;border:1px solid var(--line);background:var(--bar);color:var(--fg);border-radius:9px}
#mbox button:hover:not(:disabled){background:var(--soft)}
#mbox button.pri{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);font-weight:600}
#mbox button.pri:hover:not(:disabled){background:color-mix(in srgb,var(--btn) 88%,#000)}
#mbox button:disabled{opacity:.4}
#mbox .item{padding:10px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
#mbox .item:hover{background:var(--soft)}
#mbox .item small{color:var(--mut);white-space:nowrap}
#mbox .item .tt{flex:1;min-width:0;word-break:break-all}
#mbox .item .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#mbox .item .acts button{font-size:12px;padding:3px 10px;border-radius:7px}
#mbox .item.arch{opacity:.5}
#mbox code{display:block;background:var(--code);border:1px solid var(--line);padding:9px 11px;border-radius:9px;font:12.5px/1.45 var(--mono);word-break:break-all;margin:6px 0 12px}
#mbox .hint{font-size:13px;color:var(--mut);margin:4px 0 10px;line-height:1.5}

/* ===== 公告 / 看板 ===== */
#ann{background:var(--side);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px}
#ann .top{display:flex;gap:8px;align-items:flex-start}
#annText{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;line-height:1.55}
#ann.open #annText{display:block;max-height:40vh;overflow-y:auto;color:var(--fg)}
#ann button{font-size:12.5px;padding:3px 10px;border:1px solid var(--line);background:var(--bar);color:var(--fg);border-radius:7px;flex:none}
#ann button:hover{background:var(--soft)}
#annEdit{display:none}
#annEdit textarea{width:100%;font-size:15px;min-height:110px;max-height:40vh;border-radius:10px}
#annEdit .btns{display:flex;gap:8px;margin-top:8px}
#boardBtn{display:inline-block}
#board{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
#ann.open #board{display:block}
#claims.on{display:none}
#ann.open #claims.on{display:block}
#boardList{list-style:none;margin:0 0 8px;padding:0;max-height:40vh;overflow-y:auto}
#boardList li{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:8px}
#boardList li:hover{background:var(--hover)}
#boardList li .bt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
#boardList li .bt small{color:var(--faint);margin-left:6px;font-size:11.5px}
#boardList li.done .bt{text-decoration:line-through;color:var(--faint)}
#boardList li .pin{flex:none;width:16px;text-align:center;font-size:12px}
#boardList li input{margin:4px 0 0;flex:none;accent-color:var(--btn)}
#boardList li .bx{border:0 !important;background:transparent !important;padding:0 4px !important;color:var(--faint) !important;font-size:16px !important;line-height:1;opacity:0}
#boardList li:hover .bx{opacity:1}
@media(hover:none){#boardList li .bx{opacity:1}}
#boardList .empty{color:var(--faint)}
#board .badd{display:flex;gap:6px;align-items:center}
#board .badd select,#board .badd input{font-size:15px;font-family:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#board .badd input{flex:1;min-width:0}

/* ===== 消息流：AI 左对齐带色块头像，你的话靠右浅色气泡，系统消息是居中小字 ===== */
#feed{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 12px;-webkit-overflow-scrolling:touch}
.msg{position:relative;margin:0 0 18px;word-break:break-word;overflow-wrap:anywhere}
.msg .who{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--faint);margin-bottom:2px;line-height:1.4}
.msg .who .nm{font-weight:650;font-size:13.5px;color:var(--fg)}
.msg .body{white-space:pre-wrap}
.msg .body.md{white-space:normal}
.msg.claude,.msg.codex{padding:2px 0 2px 40px}
.msg.claude::before,.msg.codex::before{position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--font);color:#fff}
.msg.claude::before{content:"C";background:var(--claude)}
.msg.codex::before{content:"X";background:var(--codex)}
.msg.claude .nm{color:var(--claude)}
.msg.codex .nm{color:var(--codex)}
.msg.me{margin-left:auto;max-width:80%;width:fit-content;background:var(--me);border:1px solid var(--me-line);padding:8px 14px 10px;border-radius:18px 18px 6px 18px}
.msg.me .who{justify-content:flex-end}
.msg.me .who .nm{display:none}
.msg.sys{margin:4px auto 18px;width:fit-content;max-width:90%;font-size:12.5px;color:var(--mut);text-align:center;background:var(--soft);padding:3px 12px;border-radius:999px;line-height:1.5}
.msg.touser{background:color-mix(in srgb,var(--work) 7%,transparent);border-radius:12px;padding:10px 12px 10px 52px;box-shadow:inset 3px 0 0 var(--work)}
.msg.touser::before{left:12px;top:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--work);background:color-mix(in srgb,var(--work) 14%,transparent);padding:0 7px;border-radius:999px;line-height:1.6}
.msg.step{text-align:left}
.undo{margin-top:8px;font-size:12.5px;padding:4px 12px;border:1px solid color-mix(in srgb,var(--work) 45%,transparent);background:transparent;color:var(--work);border-radius:7px;font-weight:600}
.undo:hover:not(:disabled){background:color-mix(in srgb,var(--work) 10%,transparent)}
.undo:disabled{opacity:.5;border-color:var(--line);color:var(--mut);font-weight:400}
.msg.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%,40%{background-color:color-mix(in srgb,var(--btn) 16%,transparent)}100%{background-color:transparent}}
.msg.me.flash{animation:none;outline:2px solid var(--btn);outline-offset:2px}

/* markdown */
.md p{margin:0 0 10px}
.md>:last-child{margin-bottom:0}
.md h3,.md h4,.md h5,.md h6{margin:14px 0 6px;line-height:1.35;font-weight:650}
.md h3{font-size:1.15em}.md h4{font-size:1.07em}.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:3px 0}
.md li::marker{color:var(--faint)}
.md blockquote{margin:0 0 10px;padding:2px 12px;border-left:3px solid var(--line);color:var(--mut)}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.md code{padding:1px 6px;background:var(--soft);border:1px solid var(--line);border-radius:5px;font:.88em var(--mono)}
.md a{color:var(--btn);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--btn) 35%,transparent)}
.md a:hover{border-bottom-color:var(--btn)}
.md strong{font-weight:650}
.md .tbl{overflow-x:auto;margin:0 0 10px;border:1px solid var(--line);border-radius:10px}
.md table{border-collapse:collapse;font-size:.93em;width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:6px 12px;text-align:left;vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md th{background:var(--soft);font-weight:600}
.msg pre{margin:8px 0;padding:12px 14px;background:var(--code);border:1px solid var(--line);border-radius:10px;overflow-x:auto;white-space:pre;font:13px/1.5 var(--mono);max-width:100%}

/* 附件 */
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.atts img{max-width:180px;max-height:180px;border-radius:10px;display:block;border:1px solid var(--line)}
.atts audio{max-width:100%}
.atts a.file{font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--bar);border-radius:9px;color:inherit;text-decoration:none;word-break:break-all}
.atts a.file:hover{background:var(--soft)}

/* 引用 */
.who .rp{border:0;background:transparent;color:var(--faint);font-size:12px;padding:0 4px;margin-left:auto;cursor:pointer}
.who .rp:hover{color:var(--btn)}
.qt{border-left:2px solid var(--faint);padding:0 10px;margin:4px 0 6px;font-size:12.5px;color:var(--mut);cursor:pointer;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.qt:hover{color:var(--fg)}
#quote{display:none;align-items:flex-start;gap:6px;border-left:2px solid var(--btn);background:var(--soft);border-radius:8px;padding:6px 6px 6px 10px;margin-bottom:8px;font-size:13px;color:var(--mut)}
#quote.on{display:flex}
#quote .qtx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#quote button{border:0;background:transparent;color:var(--mut);font-size:18px;line-height:1;padding:0 4px}
#cmenu{display:none;position:fixed;z-index:60;min-width:160px;background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;font-size:14px}
#cmenu.on{display:block;animation:pop .12s ease-out}
#cmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:7px 12px;border-radius:7px;font-size:14px}
#cmenu button:hover{background:var(--soft)}
@media(hover:hover) and (pointer:fine){.who .rp{display:none}}

/* 跳到我的发言：聊天区右下角两个圆按钮 */
#jump{position:fixed;z-index:15;display:none;flex-direction:column;gap:6px}
#jump.on{display:flex}
#jump button{width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--bar) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--mut);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#jump button:hover{color:var(--fg);border-color:color-mix(in srgb,var(--btn) 40%,var(--line))}
#jump button:active{transform:scale(.92)}
#jump button.dim{opacity:.45}
#jump svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 状态行 ===== */
#status{display:none;padding:6px 16px;font-size:13px;color:var(--mut);background:var(--bg)}
#status.on{display:flex;align-items:center;gap:10px}
#stMain{flex:1;min-width:0}
#stText{display:flex;align-items:center;gap:8px}
#stLive .ln{margin:3px 0 0 15px;font-size:12.5px;line-height:1.5;color:var(--fg);opacity:.8;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;white-space:pre-wrap}
#stLive .ln.open{-webkit-line-clamp:unset;max-height:30vh;overflow-y:auto}
#stLive .ln b{font-weight:600;margin-right:6px}#stLive .ln .t{color:var(--faint);margin-right:6px}
#stLive .ln.claude b{color:var(--claude)}#stLive .ln.codex b{color:var(--codex)}
#stText::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--btn);animation:pulse 1.2s ease-in-out infinite}
#stops{display:flex;gap:6px;flex:none}

// 简易 markdown：先转义再套标签，只出现下面写死的几种标签；链接只认 http(s)
function mdInline(s){

    if(/^\s*>/.test(l)){flush();const q=[];while(i<L.length&&/^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++}h+='<blockquote>'+mdBlock(q.join('\n'))+'</blockquote>';continue}
    if(isRow(l)&&i+1<L.length&&isSep(L[i+1])){
      flush();const hd=cells(l);i+=2;let b='';
      while(i<L.length&&isRow(L[i])){b+='<tr>'+cells(L[i]).map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>';i++}
      h+='<div class="tbl"><table><thead><tr>'+hd.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>'+b+'</tbody></table></div>';continue;
    }
    if(m=l.match(LI)){
      flush();const items=[];
      while(i<L.length){
        const x=L[i].match(LI);
        if(x){items.push({ind:x[1].replace(/\t/g,'    ').length,ol:/\d/.test(x[2]),text:x[3]});i++}
        else if(L[i].trim()&&/^\s+/.test(L[i])&&items.length){items[items.length-1].text+='\n'+L[i].trim();i++}
        else if(!L[i].trim()&&i+1<L.length&&LI.test(L[i+1])){i++}
        else break;
      }
      let o='';const st=[];
      for(const it of items){
        while(st.length&&it.ind<st[st.length-1].ind)o+='</li></'+st.pop().tag+'>';
        const top=st[st.length-1];
        const tag=it.ol?'ol':'ul';
        if(!top||it.ind>top.ind){o+='<'+tag+'><li>';st.push({ind:it.ind,tag})}
        else if(top.tag!==tag){o+='</li></'+top.tag+'><'+tag+'><li>';top.tag=tag}   // 同级换了类型（无序 → 有序）另起一个列表
        else o+='</li><li>';
        o+=it.text.split('\n').map(mdInline).join('<br>');
      }
      while(st.length)o+='</li></'+st.pop().tag+'>';
      h+=o;continue;
    }
    para.push(l);i++;
  }
  flush();return h;
}

async function poll(){
  if(!RID||polling===RID)return;
  const rid=RID;polling=rid;
  try{
    const r=await fetch(api('messages')+'?since='+since,{cache:'no-store'});
    if(r.status===404){polling=null;return roomGone()}
    const j=await r.json();
    if(rid!==RID)return;   // 等回来的时候已经切到别的会议了
    if(j.meeting!==curMeeting){curMeeting=j.meeting;feed.innerHTML='';if(since!==0||j.messages.length<j.next){since=0;polling=null;return poll()}}
    const atBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<60;
    j.messages.forEach(add);since=j.next;
    if(j.messages.length&&atBottom)feed.scrollTop=feed.scrollHeight;
    lastRun={running:j.running||[],queued:j.queued||0};
    if(!document.hidden)markSeen(rid,j.next);
  }catch(e){}
  finally{if(polling===rid)polling=null}
  if(rid!==RID)return;
  await loadState();
  drawStatus();
}

  showModal('<h3>会议列表</h3>'+(rows||'<div class="hint">还没有会议</div>')+
    '<div class="btns" style="margin-top:10px"><button type="button" id="lTrash">回收站（'+tj.trash.length+'）</button><button type="button" id="lClose">关闭</button></div>'+

    (tj.trash.length?'<div class="btns" style="margin-top:8px"><button type="button" id="lPurge">清空回收站</button></div>':'')+
    '<div class="hint">清空后找不回来，这些会议里 AI 自己的会话（~/.claude、~/.codex 下）也一起删；别的会议还在用的不删。</div></div>'+
    '<div class="hint" style="margin-top:12px">几场会议可以同时跑。想并排看：在会议上按 Ctrl 点（或鼠标中键）在新标签页打开。</div>');
  document.getElementById('lClose').onclick=hideModal;
  document.getElementById('lTrash').onclick=()=>{const b=document.getElementById('trashBox');b.style.display=b.style.display==='none'?'block':'none'};
  const act=async(url,body)=>{const [ok,jj]=await post(url,body);if(!ok){alert(jj.error||'失败');return false}return true};
  mbox.querySelectorAll('#trashBox .item').forEach(el=>{
    el.querySelector('.rb').onclick=async e=>{e.stopPropagation();if(await act('/api/trash/restore',{id:el.dataset.id})){pollRooms();openList(true)}};
  });
  const pg=document.getElementById('lPurge');
  if(pg)pg.onclick=async()=>{if(!confirm('清空回收站？清空后找不回来。\n\n这些会议里 claude、codex 各自的会话（~/.claude、~/.codex 下的记录）也一起删掉；别的会议还在用的不删。'))return;if(await act('/api/trash/purge',{}))openList(true)};

    if(el.closest('#trashBox'))return;
    el.querySelector('.ab').onclick=async e=>{e.stopPropagation();if(await act('/api/rooms/archive',{id:el.dataset.id,on:el.querySelector('.ab').dataset.on==='1'})){await loadState();pollRooms();openList()}};
    el.querySelector('.db').onclick=async e=>{e.stopPropagation();
      if(!confirm('把「'+el.querySelector('.tt').textContent+'」移到回收站？（可以恢复）\n\n清空回收站时，这场会议里 claude、codex 各自的会话也会一起删掉。'))return;

    el.onclick=()=>{hideModal();bar.classList.remove('show');switchRoom(el.dataset.id)};
  });

function fallbackCopy(t){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove()}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));
  fallbackCopy(t);
}
function openAi(a){
  const x=S&&S.ais&&S.ais[a];if(!x)return;
  let h='<h3>'+a+'</h3>';
  if(!x.session)h+='<div class="hint">还没叫过它，先在会议里 @ 它一次。</div>';
  else h+='<div class="hint">'+(x.handed_off?'现在在终端里，网页里不会叫它。':'在会议里。')+'</div><code>'+esc(x.cmd||'')+'</code>';
  h+='<div class="btns"><button type="button" id="aClose">关闭</button>';
  if(x.session)h+='<button type="button" id="aCopy">复制命令</button>';
  h+='<button type="button" class="pri" id="aToggle"'+((!x.session||(!x.handed_off&&x.busy))?' disabled':'')+'>'+(x.handed_off?'收回':'交给终端')+'</button></div>';
  if(x.session&&!x.handed_off&&x.busy)h+='<div class="hint">它正在跑或排着队，说完才能交。</div>';
  const canC=x.session&&!x.handed_off&&!x.compacting;
  h+='<h3 style="margin-top:14px">压缩上下文</h3><div class="hint">'+(x.compacting?'正在压缩，压完会议里会插一条消息。':!x.session?'还没建会话，不用压。':x.handed_off?'在终端里，收回来再压。':'聊久了会变慢、变贵。压完它只记要点，另一个 AI 不受影响。'+(x.ctx&&x.ctx.used?'<br>现在上下文用了 '+fmtK(x.ctx.used)+(x.ctx.window?' / '+fmtK(x.ctx.window)+'（'+Math.round(x.ctx.used*100/x.ctx.window)+'%）':'')+'。':''))+'</div>'+
    '<div class="btns"><button type="button" id="aCompact"'+(canC?'':' disabled')+'>压缩 '+a+'</button></div>';
  const mo=x.model||{models:[],efforts:[],model:'',effort:''};
  const anyBusy=!!(S&&((S.running||[]).length||S.queued));
  h+='<h3 style="margin-top:14px">模型和 effort（这场会议）</h3><div class="hint">现在生效：'+esc(mo.label||'默认 · 默认')+'。空 = 用会议室默认（'+esc(mo.default||'')+'）。</div>'+
    '<input class="mi" id="mModel" list="mModels" placeholder="会议室默认（可手填模型名）" value="'+esc(mo.model)+'"><datalist id="mModels">'+mo.models.map(v=>'<option value="'+esc(v)+'">').join('')+'</datalist>'+
    '<select id="mEffort"><option value="">默认</option>'+mo.efforts.map(v=>'<option value="'+esc(v)+'"'+(v===mo.effort?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select>'+
    '<div class="btns"><button type="button" id="mSave"'+(anyBusy?' disabled':'')+'>保存模型设置</button></div>'+
    '<div class="hint" id="mHint">'+(anyBusy?'有 AI 在跑或排队，说完才能改。':'中途换模型，下一轮会慢一点、费一点。')+'</div>';
  h+='<h3 style="margin-top:14px">工具（这场会议）</h3><div id="toolsBox"><div class="hint">读取中…</div></div>';
  showModal(h);
  loadTools(a,x);
  document.getElementById('mSave').onclick=async()=>{
    const nm=document.getElementById('mModel').value.trim(),ne=document.getElementById('mEffort').value;
    if(nm!==mo.model&&x.session&&!confirm('中途换模型，下一轮会慢一点、费一点。继续？'))return;
    const [ok,j]=await post(api('models'),{ai:a,model:nm,effort:ne});
    if(!ok){alert(j.error||'失败');return}
    await loadState();poll();openAi(a);
  };
  document.getElementById('aClose').onclick=hideModal;
  document.getElementById('aCompact').onclick=async()=>{
    if(!confirm('压缩 '+a+' 的上下文？压完它只记要点。'+(x.busy?'\n\n它手上有活，会等这一轮说完再压。':'')))return;
    const [ok,j]=await post(api('compact'),{ai:a});if(!ok)alert(j.error||'失败');await loadState();poll();openAi(a);
  };
  const c=document.getElementById('aCopy');if(c)c.onclick=()=>{copyText(x.cmd);c.textContent='已复制'};
  document.getElementById('aToggle').onclick=async()=>{
    const [ok,j]=await post(api('handoff'),{ai:a,on:!x.handed_off});
    if(!ok){alert(j.error||'失败');return}
    await loadState();poll();openAi(a);
  };
}

  const busy=['claude','codex'].filter(a=>{const x=S&&S.ais&&S.ais[a];return S&&((S.running||[]).includes(a)||(x&&x.busy&&!x.compacting))});

  const want=(each?busy.map(a=>'停 '+a):[]).concat(busy.length>1||(!each&&busy.length)?['全停']:[]).join('|');

  if(busy.length>1||(!each&&busy.length)){const b=document.createElement('button');b.type='button';b.textContent=each?'全停':'停';b.onclick=()=>stopAi('');stopsEl.appendChild(b)}
}

// 跳到我的发言：点 = 上一条 / 下一条"你"说的话，长按 = 到顶 / 到底
const jumpEl=document.getElementById('jump'),jUp=document.getElementById('jUp'),jDn=document.getElementById('jDn');
function feedTop(){return feed.getBoundingClientRect().top+12}
function myMsgs(){return [...feed.querySelectorAll('.msg.me')]}
function prevMine(){const t=feedTop()-4;return myMsgs().filter(e=>e.getBoundingClientRect().top<t).pop()}
function nextMine(){const t=feedTop()+4;return myMsgs().find(e=>e.getBoundingClientRect().top>t)}
function atEnd(){return feed.scrollHeight-feed.scrollTop-feed.clientHeight<4}
// 平滑滚动；页面在后台等情况下动画不走，就直接跳过去
function scrollFeed(top){
  const from=feed.scrollTop;top=Math.max(0,Math.min(top,feed.scrollHeight-feed.clientHeight));
  feed.scrollTo({top,behavior:'smooth'});
  setTimeout(()=>{if(Math.abs(feed.scrollTop-from)<1&&Math.abs(top-from)>1)feed.scrollTop=top},400);
}
function goTo(el){
  scrollFeed(feed.scrollTop+el.getBoundingClientRect().top-feedTop());
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1200);
}
function syncJump(){
  const scrollable=feed.scrollHeight>feed.clientHeight+20;
  jumpEl.classList.toggle('on',scrollable);
  if(!scrollable)return;
  // 两边都在：位置跟着聊天区右边、输入区（和状态行）上面
  const fr=feed.getBoundingClientRect();
  jumpEl.style.right=Math.max(8,innerWidth-fr.right+16)+'px';
  jumpEl.style.bottom=Math.max(8,innerHeight-fr.bottom+12)+'px';
  jUp.classList.toggle('dim',!prevMine()&&feed.scrollTop<4);
  jDn.classList.toggle('dim',atEnd());
}
function holdable(btn,onTap,onHold){
  let timer=null,held=false;
  const clear=()=>{clearTimeout(timer);timer=null};
  btn.addEventListener('pointerdown',e=>{if(e.button)return;held=false;clear();timer=setTimeout(()=>{held=true;timer=null;onHold();if(navigator.vibrate)navigator.vibrate(15)},500)});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>btn.addEventListener(t,clear));
  btn.addEventListener('click',e=>{if(held){held=false;e.preventDefault();return}onTap()});
  btn.addEventListener('contextmenu',e=>e.preventDefault());   // 手机长按别弹菜单
}
holdable(jUp,()=>{const el=prevMine();if(el)goTo(el);else scrollFeed(0)},()=>scrollFeed(0));
holdable(jDn,()=>{const el=nextMine();if(el)goTo(el);else scrollFeed(feed.scrollHeight)},()=>scrollFeed(feed.scrollHeight));
let jumpRaf=0;
const queueJump=()=>{if(!jumpRaf)jumpRaf=requestAnimationFrame(()=>{jumpRaf=0;syncJump()})};
feed.addEventListener('scroll',queueJump);addEventListener('resize',queueJump);
if(window.ResizeObserver){const ro=new ResizeObserver(queueJump);ro.observe(feed);ro.observe(document.querySelector('footer'))}
setInterval(queueJump,1500);
// 我的发言目录：列出"你"说过的每一句，点一下跳过去
const tocEl=document.getElementById('toc'),tocList=document.getElementById('tocList'),tocQ=document.getElementById('tocQ');
const narrow=()=>innerWidth<=700;
function tocLine(m){
  const t=(m.text||'').replace(/```[\s\S]*?(```|$)/g,' [代码] ').replace(/\s+/g,' ').trim();
  const n=(m.attachments||[]).length;
  return (t||'')+(n?(t?' ':'')+'📎'+n:'')||'（空）';
}
function curMine(){const mid=feedTop()+feed.clientHeight/3;return myMsgs().filter(e=>e.getBoundingClientRect().top<=mid).pop()}
function drawToc(){
  const q=tocQ.value.trim().toLowerCase(),cur=curMine();
  const els=myMsgs();
  document.getElementById('tocN').textContent=els.length+' 条';
  tocList.innerHTML='';
  let curLi=null;
  els.forEach((el,i)=>{
    const m=msgById[+el.dataset.id];if(!m)return;
    const line=tocLine(m);
    if(q&&line.toLowerCase().indexOf(q)<0)return;
    const li=document.createElement('li');
    li.innerHTML='<span class="t">'+esc((m.time||'').slice(0,5)||'#'+(i+1))+'</span><span class="x">'+esc(line)+'</span>';
    li.title=(m.text||'').slice(0,400);
    if(el===cur){li.classList.add('cur');curLi=li}
    li.onclick=()=>{goTo(el);if(narrow())closeToc();else{tocList.querySelectorAll('.cur').forEach(x=>x.classList.remove('cur'));li.classList.add('cur')}};
    tocList.appendChild(li);
  });
  if(!tocList.children.length){const li=document.createElement('li');li.className='empty';li.textContent=q?'没搜到':'你还没发过言';tocList.appendChild(li)}
  if(curLi)curLi.scrollIntoView({block:'center'});
}
function placeToc(){
  if(narrow()){tocEl.style.left=tocEl.style.right=tocEl.style.bottom='';return}
  const r=jumpEl.getBoundingClientRect();
  tocEl.style.right=(innerWidth-r.left+8)+'px';
  tocEl.style.bottom=(innerHeight-r.bottom)+'px';
  tocEl.style.left='auto';
}
function openToc(){tocQ.value='';tocEl.classList.add('on');placeToc();drawToc();if(!touch)tocQ.focus()}
function closeToc(){tocEl.classList.remove('on')}

  if(!vw.classList.contains('on'))return;
  if(e.key==='Escape'){e.preventDefault();ed?cancelEdit():closeViewer();return}
  if(ed){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undoEdit()}return}
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);
});
// —— 标注 ——
const TOOL_HINT={pen:'按住拖动画线',arrow:'从起点拖到箭头指的地方',rect:'拖出一个框',text:'点一下要写字的位置',crop:'拖出要留下的区域，松手就裁'};
const THICK=[['细',.6],['中',1],['粗',1.8]];
function startEdit(){
  if(!vImg.complete){vImg.addEventListener('load',startEdit,{once:true});return}   // 刚切过来还在加载：加载完再进
  if(!vImg.naturalWidth){alert('这张图打不开');return}
  vStage.classList.remove('zoom');
  ed={hist:[],tool:ed&&ed.tool||'pen',color:document.querySelector('#vTools .sw.on').dataset.color,thick:ed?ed.thick:1,drag:null};
  setSize(vImg.naturalWidth,vImg.naturalHeight);vctx.drawImage(vImg,0,0);
  vw.classList.add('edit');syncTools();fitCanvas();
}
function endEdit(){ed=null;vw.classList.remove('edit')}
function cancelEdit(){if(ed.hist.length&&!confirm('丢掉这次的标注？'))return;endEdit()}
function setSize(w,h){vCv.width=vOv.width=w;vCv.height=vOv.height=h}
function fitCanvas(){
  if(!ed)return;
  const W=vStage.clientWidth-16,H=vStage.clientHeight-16,s=Math.min(W/vCv.width,H/vCv.height,1);
  const w=Math.round(vCv.width*s)+'px',h=Math.round(vCv.height*s)+'px';
  vCv.style.width=vOv.style.width=w;vCv.style.height=vOv.style.height=h;
}
addEventListener('resize',fitCanvas);
function syncTools(){
  document.querySelectorAll('#vTools [data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===ed.tool));
  document.getElementById('vUndo').disabled=!ed.hist.length;
  document.getElementById('vThick').textContent=THICK.find(t=>t[1]===ed.thick)[0];
  vHint.textContent=TOOL_HINT[ed.tool]+(touch?'':' · Ctrl+Z 撤销 · Esc 取消');
  vWrap.style.cursor=ed.tool==='text'?'text':'crosshair';
}
document.querySelectorAll('#vTools [data-tool]').forEach(b=>b.onclick=()=>{ed.tool=b.dataset.tool;syncTools()});
document.querySelectorAll('#vTools .sw').forEach(b=>b.onclick=()=>{document.querySelectorAll('#vTools .sw').forEach(x=>x.classList.toggle('on',x===b));if(ed)ed.color=b.dataset.color});
document.getElementById('vThick').onclick=()=>{const i=THICK.findIndex(t=>t[1]===ed.thick);ed.thick=THICK[(i+1)%THICK.length][1];syncTools()};
document.getElementById('vEdit').onclick=startEdit;
document.getElementById('vCancel').onclick=cancelEdit;
document.getElementById('vUndo').onclick=()=>undoEdit();
function lw(){return Math.max(2,Math.round(Math.max(vCv.width,vCv.height)/170*ed.thick))}
function snap(){
  const c=document.createElement('canvas');c.width=vCv.width;c.height=vCv.height;c.getContext('2d').drawImage(vCv,0,0);
  ed.hist.push(c);if(ed.hist.length>30)ed.hist.shift();syncTools();
}
function undoEdit(){
  if(!ed||!ed.hist.length)return;
  const c=ed.hist.pop();setSize(c.width,c.height);vctx.drawImage(c,0,0);fitCanvas();syncTools();
}
function pt(e){const r=vCv.getBoundingClientRect();return {x:(e.clientX-r.left)*vCv.width/r.width,y:(e.clientY-r.top)*vCv.height/r.height}}
function stroke(c,col,w){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round'}
function drawArrow(c,a,b){
  const w=c.lineWidth,ang=Math.atan2(b.y-a.y,b.x-a.x),hl=Math.max(w*4,12);
  c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x-Math.cos(ang)*hl*.6,b.y-Math.sin(ang)*hl*.6);c.stroke();
  c.beginPath();c.moveTo(b.x,b.y);c.lineTo(b.x-hl*Math.cos(ang-.45),b.y-hl*Math.sin(ang-.45));c.lineTo(b.x-hl*Math.cos(ang+.45),b.y-hl*Math.sin(ang+.45));c.closePath();c.fill();
}
function box(a,b){return {x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)}}
function preview(a,b){
  octx.clearRect(0,0,vOv.width,vOv.height);stroke(octx,ed.color,lw());
  if(ed.tool==='arrow')drawArrow(octx,a,b);
  else if(ed.tool==='rect'){const r=box(a,b);octx.strokeRect(r.x,r.y,r.w,r.h)}
  else if(ed.tool==='crop'){
    const r=box(a,b);octx.fillStyle='rgba(0,0,0,.55)';octx.fillRect(0,0,vOv.width,vOv.height);octx.clearRect(r.x,r.y,r.w,r.h);
    octx.setLineDash([lw()*3,lw()*2]);octx.strokeStyle='#fff';octx.lineWidth=Math.max(1,lw()/2);octx.strokeRect(r.x,r.y,r.w,r.h);octx.setLineDash([]);
  }
}
vWrap.addEventListener('pointerdown',e=>{
  if(!ed||e.button)return;e.preventDefault();
  const p=pt(e);
  if(ed.tool==='text'){
    const s=prompt('写什么？');if(!s||!s.trim())return;
    snap();const fs=Math.max(16,Math.round(Math.max(vCv.width,vCv.height)/32*ed.thick));
    vctx.font='bold '+fs+'px system-ui,"Microsoft YaHei",sans-serif';vctx.textBaseline='top';
    vctx.lineWidth=Math.max(2,fs/7);vctx.lineJoin='round';vctx.strokeStyle=ed.color==='#111111'?'#fff':'rgba(0,0,0,.75)';vctx.fillStyle=ed.color;
    s.split('\n').forEach((l,i)=>{vctx.strokeText(l,p.x,p.y+i*fs*1.25);vctx.fillText(l,p.x,p.y+i*fs*1.25)});
    return;
  }
  vWrap.setPointerCapture(e.pointerId);
  ed.drag={a:p,b:p};
  if(ed.tool==='pen'){snap();stroke(vctx,ed.color,lw());vctx.beginPath();vctx.moveTo(p.x,p.y);vctx.lineTo(p.x+.01,p.y);vctx.stroke()}
});
vWrap.addEventListener('pointermove',e=>{
  if(!ed||!ed.drag)return;
  const p=pt(e),d=ed.drag;
  if(ed.tool==='pen'){vctx.beginPath();vctx.moveTo(d.b.x,d.b.y);vctx.lineTo(p.x,p.y);vctx.stroke();d.b=p}
  else{d.b=p;preview(d.a,p)}
});
function finishDrag(){
  if(!ed||!ed.drag)return;
  const {a,b}=ed.drag;ed.drag=null;octx.clearRect(0,0,vOv.width,vOv.height);
  if(ed.tool==='pen')return;
  const r=box(a,b),min=Math.max(6,lw()*2);
  if(r.w<min&&r.h<min)return;
  if(ed.tool==='crop'){
    if(r.w<min||r.h<min)return;
    const x=Math.max(0,Math.round(r.x)),y=Math.max(0,Math.round(r.y));
    const w=Math.min(vCv.width-x,Math.round(r.w)),h=Math.min(vCv.height-y,Math.round(r.h));
    snap();const c=ed.hist[ed.hist.length-1];setSize(w,h);vctx.drawImage(c,x,y,w,h,0,0,w,h);fitCanvas();return;
  }
  snap();stroke(vctx,ed.color,lw());
  if(ed.tool==='arrow')drawArrow(vctx,a,b);else vctx.strokeRect(r.x,r.y,r.w,r.h);
}
vWrap.addEventListener('pointerup',finishDrag);
vWrap.addEventListener('pointercancel',finishDrag);
function editedName(){const n=(vList[vIdx].name||'图片').replace(/\.[^.]+$/,'');return (/_标注$/.test(n)?n:n+'_标注')+'.png'}
function canvasFile(){return new Promise(r=>vCv.toBlob(b=>r(b&&new File([b],editedName(),{type:'image/png'})),'image/png'))}
document.getElementById('vSave').onclick=async()=>{
  const f=await canvasFile();if(!f)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};
document.getElementById('vDone').onclick=async()=>{
  const f=await canvasFile();if(!f){alert('导出失败');return}
  const it=vList[vIdx];
  if(it.pend!=null&&pend[it.pend]&&pend[it.pend].url===it.url){pend.splice(it.pend,1);drawPend()}   // 改的是还没发的附件：换掉原图
  endEdit();vw.classList.remove('on');vImg.removeAttribute('src');
  await upload(f);ta.focus();
};
// ===== 几场会议：切换、列表、谁在跑、哪场在等你 =====
const roomList=document.getElementById('roomList');
let ROOMS=[];
function seenMap(){try{return JSON.parse(localStorage.getItem('rt_seen')||'{}')}catch(e){return {}}}
function markSeen(rid,n){try{const m=seenMap();if(m[rid]!==n){m[rid]=n;localStorage.setItem('rt_seen',JSON.stringify(m))}}catch(e){}}
// 一场会议的状态牌：在跑 > 有话对你说（AI @用户 了你还没看）> 有新消息
function roomBadge(m){
  if((m.running||[]).some(x=>!x.startsWith('compact:')))return ['run',(m.running.filter(x=>!x.startsWith('compact:')).join('、'))+' 在想'];
  if(m.id===RID)return null;
  const seen=seenMap()[m.id];
  if(seen==null)return null;   // 这台浏览器没看过的老会议：不标
  if(m.last_to_user>=seen)return ['you','等你'];
  if(m.count>seen)return ['','新 '+(m.count-seen)];
  return null;
}
function drawRooms(){
  const live=ROOMS.filter(m=>!m.archived||m.id===RID);
  const html=live.map(m=>{
    const b=roomBadge(m),dot=b?(b[0]==='run'?'run':b[0]==='you'?'you':'new'):'';
    return '<li class="'+(m.id===RID?'cur':'')+(m.archived?' arch':'')+'"><a href="?r='+encodeURIComponent(m.id)+'" data-id="'+esc(m.id)+'" title="'+esc(m.title+' · '+m.workdir)+'"><span class="dot '+dot+'"></span><span class="t">'+esc(m.title)+'</span>'+(b?'<span class="b '+b[0]+'">'+esc(b[1])+'</span>':'')+'</a></li>';
  }).join('')||'<li class="hint" style="padding:6px 8px;color:var(--mut)">还没有会议</li>';
  if(roomList.innerHTML!==html)roomList.innerHTML=html;
  const wait=ROOMS.filter(m=>m.id!==RID&&!m.archived&&(roomBadge(m)||[])[0]==='you').length;
  const lb=document.getElementById('bList');lb.textContent='会议列表'+(wait?' · '+wait+' 等你':'');
  document.getElementById('menu').classList.toggle('attn',wait>0);
  const base=S&&S.title?S.title+' · 会议室':'会议室';
  document.title=(wait?'('+wait+') ':'')+base;
}
roomList.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');if(!a)return;
  if(e.ctrlKey||e.metaKey||e.shiftKey||e.button)return;   // Ctrl 点 / 中键：新标签页里开
  e.preventDefault();switchRoom(a.dataset.id);
});
async function pollRooms(){
  try{
    const j=await (await fetch('/api/rooms',{cache:'no-store'})).json();ROOMS=j.rooms||[];
    // 第一次见到的会议：把现在的消息数记成"看过了"，之后新来的才标（不然刚装好的手机上永远不提醒）
    const m=seenMap();let ch=false;
    ROOMS.forEach(r=>{if(m[r.id]==null){m[r.id]=r.count;ch=true}});
    if(ch)try{localStorage.setItem('rt_seen',JSON.stringify(m))}catch(e){}
    drawRooms();return j;
  }catch(e){return null}
}
function resetRoomView(){
  since=0;curMeeting=undefined;S=null;feed.innerHTML='';
  for(const k in msgById)delete msgById[k];
  pend=[];drawPend();setQuote(null);lastRun={running:[],queued:0};
  annVal='';showAnn();boardSig='';closeEdit();
  if(typeof closeToc==='function')closeToc();
  if(vw.classList.contains('on')){endEdit();vw.classList.remove('on')}
  document.getElementById('stops').dataset.k='';
}
function switchRoom(id,replace){
  if(!id)return;
  if(id!==RID){RID=id;resetRoomView()}
  const u='?r='+encodeURIComponent(id);
  if(location.search!==u)(replace?history.replaceState:history.pushState).call(history,{r:id},'',u);
  post(api('open'),{});
  drawRooms();
  poll().then(()=>{feed.scrollTop=feed.scrollHeight;queueJump()});
}
addEventListener('popstate',()=>{const id=new URLSearchParams(location.search).get('r');if(id&&id!==RID){RID=id;resetRoomView();drawRooms();poll().then(()=>{feed.scrollTop=feed.scrollHeight})}});
let goneShown=false;
function roomGone(){
  if(goneShown)return;goneShown=true;
  showModal('<h3>这场会议不在了</h3><div class="hint">它被删了（移进了回收站），或者会议号不对。</div><div class="btns"><button type="button" id="gList" class="pri">去会议列表</button></div>');
  document.getElementById('gList').onclick=()=>{goneShown=false;hideModal();RID=null;resetRoomView();pickRoom()};
}
async function pickRoom(){
  const j=await pollRooms();
  const rooms=(j&&j.rooms)||[];
  const id=(j&&j.last&&rooms.some(m=>m.id===j.last)&&j.last)||((rooms.find(m=>!m.archived)||rooms[0]||{}).id);
  if(id)switchRoom(id,true);
  else if(!modal.classList.contains('show'))openNew(true);
}
document.getElementById('rNew').onclick=()=>openNew(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&RID&&since)markSeen(RID,since)});

// ===== 正在改的文件（文件护栏）=====
const claimList=document.getElementById('claimList');
let claimSig='';
function drawClaims(){
  const cs=(S&&S.claims)||[];
  document.getElementById('claims').classList.toggle('on',true);
  const sig=JSON.stringify(cs);if(sig===claimSig)return;claimSig=sig;
  claimList.innerHTML=cs.length?cs.map(c=>{
    const nm=c.shown.replace(/[\\/]+$/,'').split(/[\\/]/).pop()||c.shown;
    const how=c.kind==='auto'?'这一轮在改':'占着'+(c.mins_left!=null?'，还剩约 '+c.mins_left+' 分钟':'')+(c.reason?'：'+c.reason:'');
    return '<li class="ai-'+esc(c.ai)+'"><span class="cf"><b>'+esc(nm)+(c.dir?'/':'')+'</b> · '+esc(c.who)+'<small>'+esc(how)+' · '+esc(c.shown)+'</small></span><button type="button" data-key="'+esc(c.key)+'" title="强行放开（AI 下次改它就不会被挡）">放开</button></li>';
  }).join(''):'<li style="color:var(--faint)">（没人占着文件。AI 改文件时会自动占住，说完就放开）</li>';
}
claimList.onclick=async e=>{
  const b=e.target.closest('button[data-key]');if(!b)return;
  if(!confirm('强行放开这个文件？\n\n占着它的 AI 可能还在改；放开后别的 AI 就能同时改它了。'))return;
  const [ok,j]=await post('/api/claims/release',{key:b.dataset.key});if(!ok)alert(j.error||'失败');await loadState();
};
document.getElementById('cMine').onclick=async()=>{
  const t=prompt('你自己在手动改哪些文件？占住后 AI 改它们会被挡下。\n填完整路径，几个用换行或分号隔开：');
  if(!t||!t.trim())return;
  const mins=prompt('占多久（分钟，最多 240）？','60');if(mins===null)return;
  const [ok,j]=await post('/api/claims/mine',{paths:t.split(/[;\n]+/).map(x=>x.trim()).filter(Boolean),minutes:+mins||60});
  if(!ok){alert(j.error||'失败');return}
  if(j.blocked&&j.blocked.length)alert('这些现在被 AI 占着，没占上：\n'+j.blocked.map(x=>x.path+'（'+x.by+'）').join('\n'));
  await loadState();
};

// ===== 工具：这场会议里 MCP / 插件 / 技能开哪些 =====
async function loadTools(a,x){
  const box=document.getElementById('toolsBox');if(!box)return;
  let t;
  try{const r=await fetch(api('tools')+'?ai='+a,{cache:'no-store'});t=await r.json();if(!r.ok)throw 0}catch(e){box.innerHTML='<div class="hint">读不到工具清单</div>';return}
  const li=(id,on,name,sub,tags,locked)=>'<li class="'+(locked?'lk':'')+'"><input type="checkbox" data-id="'+esc(id)+'"'+(on?' checked':'')+(locked?' disabled':'')+'><span class="tn">'+esc(name)+(tags||[]).map(g=>'<span class="tg">'+esc(g)+'</span>').join('')+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></li>';
  const empty='<li class="empty">（没有）</li>';
  const pName=id=>id.replace(/@.*$/,'');
  box.innerHTML=
    '<div class="hint">只管这场会议的 '+a+'。会议室自己的 bridge（看目标、占文件、中途发进度）一直接着。</div>'+
    '<h4>MCP 服务（只在干活模式加载）</h4><ul class="tl" id="tMcp">'+(t.mcp.map(m=>li(m.name,m.on,m.name,m.source)).join('')||empty)+'</ul>'+
    '<h4>插件</h4><ul class="tl" id="tPlug">'+(t.plugins.map(p=>li(p.id,p.on,p.label||pName(p.id),p.label?'':p.id,[p.hooks?'带钩子':'',p.synced?'claude.ai 同步':'',p.global?'':'平时关着'].filter(Boolean))).join('')||empty)+'</ul>'+
    '<h4>技能</h4><ul class="tl" id="tSkill">'+(t.skills.map(k=>li(k.name,k.on,k.name,(k.locked?'插件带的，跟着插件开关 · ':k.source+' · ')+(k.desc||''),[],k.locked)).join('')||empty)+'</ul>'+
    '<div class="btns"><button type="button" id="tSave"'+(x.busy?' disabled':'')+'>保存工具设置</button></div>'+
    '<div class="hint">'+(x.busy?'它正在跑或排着队，说完才能改。':'带钩子的插件（比如 superpowers 开场会往会话里塞一大段说明）、从 claude.ai 同步来的插件，会议室里默认关。改了下一轮生效'+(a==='codex'?'（codex 的后台会重起一次）':'')+'。')+'</div>';
  const defOn=p=>(p.hooks||p.synced)?false:p.global;
  document.getElementById('tSave').onclick=async()=>{
    const val=sel=>[...box.querySelectorAll(sel+' input[data-id]')];
    const mcp=val('#tMcp').filter(i=>i.checked).map(i=>i.dataset.id);
    const plugins={};
    val('#tPlug').forEach(i=>{const p=t.plugins.find(q=>q.id===i.dataset.id);if(!p)return;if(i.checked!==defOn(p)||p.set)plugins[p.id]=i.checked});
    const skills_off=val('#tSkill').filter(i=>!i.disabled&&!i.checked).map(i=>i.dataset.id);
    const [ok,j]=await post(api('tools'),{ai:a,tools:{mcp,plugins,skills_off}});
    if(!ok){alert(j.error||'失败');return}
    await loadState();openAi(a);
  };
}

setInterval(()=>{if(RID)poll()},1500);
setInterval(pollRooms,3000);
if(RID)switchRoom(RID,true);else pickRoom();
</script>
